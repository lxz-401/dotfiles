# ==============================================================================
# gnome-wallpaper-switcher Configuration
#
# Copy or symlink this file to:
#   ~/.config/gnome-wallpaper-switcher/config.conf
# ==============================================================================

# Base directory where your wallpapers are stored.
# Subdirectories can be organized into categories (e.g., anime, dark, nature).
WALLPAPERS_DIR="$HOME/Pictures/Wallpapers"

# Default switching mode:
#   forward  - Sequential navigation (sorted by version/alphabetical order)
#   backward - Reverse sequential navigation
#   random   - Pseudo-random selection (avoids selecting the current image)
MODE="forward"

# Default category to target (subfolder name inside WALLPAPERS_DIR).
# Leave empty ("") to scan all folders, or set a folder name (e.g. "anime", "dark").
# Note: Selecting a category via CLI (-c <NAME>) will be remembered across runs
# until cleared via (-a / --all).
CATEGORY="dark"

# Automatic switching interval in minutes when running in daemon mode.
INTERVAL=15

# Send a desktop notification on wallpaper transition (true/false).
# Requires 'libnotify' (notify-send).
NOTIFY=false
